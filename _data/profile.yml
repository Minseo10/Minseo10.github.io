short_bio: >-
  <p>
    <strong>ABOUT ME</strong> <br/>
    I am currently a master’s student in <a href="http://graphics.ewha.ac.kr" target="_blank">Computer Graphics Lab</a> at 
    <a href="http://ewha.ac.kr" target="_blank">Ewha Womans University, Korea</a>, advised by  
    <a href="http://home.ewha.ac.kr/~kimy/" target="_blank">Dr. Young J. Kim</a>.
    My research focuses on <strong>robotics</strong>, particularly in task and motion planning.
    <br/>
    I received my B.S. with honors in the Department of Computer Science and Engineering  
    and Mathematics from <a href="http://ewha.ac.kr" target="_blank">Ewha Womans University</a> in 2024.  
  </p>
  <p>
  <strong>RESEARCH GOAL</strong><br/>
  My ultimate goal is to develop <strong>fully automated robotic systems</strong> that integrate with humans and operate effectively in diverse real-world environments.  
  <br/>
  To achieve this, I focus on <strong>task and motion planning</strong>, leveraging foundation models like LLMs and VLMs to enhance generalizability and address real-world deployment challenges. 
  Moreover, I work on various tasks to enable robots to assist humans in daily life, including cloth manipulation and tabletop service with bimanual manipulators. 
  <br/>
  Looking ahead, I believe that achieving full robotic assistance requires not only manipulators but also mobility. My future direction is to develop <strong>mobile manipulators</strong> that can navigate and interact in human-centered environments.
  </p>

