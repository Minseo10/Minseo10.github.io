short_bio: >-
  <p>
    <strong>ABOUT ME</strong> <br/>
    Hi! I’m currently a master’s student in <a href="http://ewha.ac.kr" target="_blank">Ewha Womans University, Korea</a>, Department of Computer Science and Engineering.
    I am a robotics researcher at the <a href="http://graphics.ewha.ac.kr" target="_blank">Computer Graphics Lab</a>, advised by <a href="http://home.ewha.ac.kr/~kimy/" target="_blank">Dr. Young J. Kim</a>.
    <br/>
    I received my B.S. with honors in Computer Science and Engineering and Mathematics (double major) from <a href="http://ewha.ac.kr" target="_blank">Ewha Womans University</a> in 2024. 
  </p>
  <p>
  <strong>RESEARCH</strong><br/>
  I develop <strong>Task and Motion Planning (TAMP)</strong> systems, leveraging foundation models such as LLMs/VLMs to enhance generalization and tackle real-world deployment challenges. 
  </p>

